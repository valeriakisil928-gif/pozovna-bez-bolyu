<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Позовна без болю — бот для складання документів</title>
<style>
:root{--bg:#f3f1ec;--panel:#fffdf9;--ink:#1d2a2f;--mute:#65737a;--bot:#e6ede9;--me:#1f4d47;--meink:#fff;--line:#d9d5cc;--acc:#1f4d47;--warn:#8a5a00;--warnbg:#fff3d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a1c;--panel:#182427;--ink:#e8eeee;--mute:#8fa1a6;--bot:#22343a;--me:#3f8f83;--meink:#fff;--line:#2c3f44;--acc:#5fb3a5;--warn:#f0c674;--warnbg:#3a3120}}
:root[data-theme="dark"]{--bg:#111a1c;--panel:#182427;--ink:#e8eeee;--mute:#8fa1a6;--bot:#22343a;--me:#3f8f83;--meink:#fff;--line:#2c3f44;--acc:#5fb3a5;--warn:#f0c674;--warnbg:#3a3120}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;display:flex;justify-content:center}
.app{width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;background:var(--panel);border-inline:1px solid var(--line)}
header{padding:14px 18px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0}
header p{margin:2px 0 0;font:13px/1.4 system-ui,sans-serif;color:var(--mute)}
#log{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.b{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}
.u{background:var(--me);color:var(--meink);align-self:flex-end;border-bottom-right-radius:4px;font-family:system-ui,sans-serif}
.w{background:var(--warnbg);color:var(--warn);font:13px/1.4 system-ui,sans-serif;align-self:stretch;max-width:100%}
.doc{align-self:stretch;max-width:100%;background:#fff;color:#111;border:1px solid var(--line);padding:18px;font:14px/1.55 "Times New Roman",serif;white-space:pre-wrap;border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start}
button{font:14px system-ui,sans-serif;cursor:pointer}
.chip{background:transparent;color:var(--acc);border:1.5px solid var(--acc);border-radius:20px;padding:7px 14px}
.chip:hover,.chip:focus-visible{background:var(--acc);color:var(--panel)}
.act{display:flex;gap:8px;flex-wrap:wrap;align-self:flex-start}
.act button{background:var(--acc);color:var(--panel);border:0;border-radius:8px;padding:9px 14px}
form,.bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
#in{flex:1;font:16px system-ui,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);min-width:0}
#send{background:var(--acc);color:var(--panel);border:0;border-radius:10px;padding:0 18px}
#in:disabled,#send:disabled{opacity:.4}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:d 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes d{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
</style>
</head>
<body>
<div class="app">
<header><h1>Позовна без болю</h1><p>Бот складає проєкт документа за вашими відповідями. Це не юридична консультація.</p></header>
<div id="log" aria-live="polite"></div>
<div class="bar"><input id="in" placeholder="Ваша відповідь…" aria-label="Ваша відповідь" disabled><button id="send" disabled>Надіслати</button></div>
</div>
<script>
const $=s=>document.querySelector(s),log=$('#log'),inp=$('#in'),send=$('#send');
const today=new Date().toLocaleDateString('uk-UA');
const _=v=>v&&v.trim()?v.trim():'____________';

const T={
pret:{name:'Претензія за неякісний товар',
qs:[
['seller','Назва продавця (магазину) та його адреса?','ТОВ «Техно», м. Київ, вул. Хрещатик, 1'],
['name','Ваші прізвище, ім’я та по батькові?','Шевченко Тарас Григорович'],
['addr','Ваша адреса проживання?','м. Київ, вул. Лесі Українки, 5, кв. 10'],
['phone','Ваш номер телефону?','+380...'],
['product','Який товар ви придбали (назва, модель)?','Смартфон XYZ 128 ГБ'],
['date','Дата покупки?','01.09.2026'],
['price','Ціна товару, грн?','12000'],
['defect','Опишіть недолік: що саме зламалося чи не працює?','Не вмикається екран через 3 дні після покупки'],
['demand','Чого ви вимагаєте?',['Повернути гроші','Замінити на аналогічний товар','Безоплатно усунути недолік','Зменшити ціну']]],
build:a=>{const d={'Повернути гроші':'розірвати договір купівлі-продажу та повернути сплачені за товар кошти у розмірі '+_(a.price)+' грн','Замінити на аналогічний товар':'замінити товар на аналогічний належної якості','Безоплатно усунути недолік':'безоплатно усунути недолік товару','Зменшити ціну':'відповідним чином зменшити ціну товару'}[a.demand];
return `Продавцю: ${_(a.seller)}\nВід споживача: ${_(a.name)}\nАдреса: ${_(a.addr)}\nТел.: ${_(a.phone)}\n\nПРЕТЕНЗІЯ\nщодо товару неналежної якості\n\n${_(a.date)} я придбав(-ла) у Вас товар: ${_(a.product)}, вартістю ${_(a.price)} грн.\n\nПротягом гарантійного строку виявлено недолік: ${_(a.defect)}.\n\nЗгідно зі ст. 8 Закону України «Про захист прав споживачів» споживач має право у разі виявлення протягом встановленого строку недоліків вимагати від продавця задоволення своїх вимог.\n\nНа підставі викладеного ВИМАГАЮ: ${d}.\n\nПрошу задовольнити вимогу у строк, визначений ст. 8 Закону (14 днів з дня пред’явлення). У разі відмови буду змушений(-а) звернутися до суду та до Державної служби з питань безпечності харчових продуктів та захисту споживачів із вимогою стягнення також неустойки та моральної шкоди.\n\nДодатки: копія чека/договору; копія гарантійного талона.\n\nДата: ${today}\nПідпис: ____________ / ${_(a.name)}`}},

nakaz:{name:'Заява про видачу судового наказу (борг)',
qs:[
['court','Назва місцевого суду за місцем проживання боржника?','Шевченківський районний суд міста Києва'],
['name','Ваші ПІБ (стягувача)?','Коваленко Іван Петрович'],
['addr','Ваша адреса та РНОКПП (ІПН)?','м. Львів, вул. Зелена, 3; РНОКПП 1234567890'],
['debtor','ПІБ боржника?','Мельник Олег Степанович'],
['daddr','Адреса боржника (та РНОКПП, якщо відомий)?','м. Київ, вул. Сумська, 7, кв. 2'],
['basis','На якій підставі виник борг? (договір, розписка, дата)','Розписка від 10.01.2026'],
['amount','Сума боргу, грн?','50000'],
['due','До якої дати боржник мав повернути кошти?','10.06.2026']],
build:a=>`До ${_(a.court)}\n\nСтягувач: ${_(a.name)}\n${_(a.addr)}\n\nБоржник: ${_(a.debtor)}\n${_(a.daddr)}\n\nЦіна вимоги: ${_(a.amount)} грн\n\nЗАЯВА\nпро видачу судового наказу\n\n${_(a.basis)} між мною та боржником виникло грошове зобов’язання. Відповідно до нього боржник мав повернути ${_(a.amount)} грн до ${_(a.due)}, проте свого обов’язку не виконав.\n\nЗгідно зі ст. 161 Цивільного процесуального кодексу України судовий наказ видається, якщо заявлено вимогу про стягнення заборгованості за письмовою угодою, і вимога є безспірною.\n\nВраховуючи викладене, керуючись ст. 161–163 ЦПК України, ПРОШУ:\n1. Видати судовий наказ про стягнення з ${_(a.debtor)} на мою користь ${_(a.amount)} грн боргу.\n2. Стягнути з боржника судові витрати (судовий збір).\n\nДодатки: документ, що підтверджує борг (оригінал/копія); квитанція про сплату судового збору; копії заяви для боржника; документи, що підтверджують особу.\n\nДата: ${today}\nПідпис: ____________ / ${_(a.name)}`},

vidstr:{name:'Заява про відстрочку виконання рішення',
qs:[
['court','Назва суду, що ухвалив рішення?','Голосіївський районний суд міста Києва'],
['name','Ваші ПІБ (боржника)?','Бондаренко Марія Олексіївна'],
['addr','Ваша адреса?','м. Київ, вул. Садова, 12, кв. 4'],
['creditor','ПІБ або назва стягувача?','ТОВ «Фінанс Плюс»'],
['case','Номер справи та дата рішення?','справа № 752/1234/26, рішення від 15.07.2026'],
['amount','Що присуджено стягнути (сума)?','30000 грн'],
['reason','Чому ви не можете виконати рішення зараз? (складні обставини)','Втрата роботи, на утриманні двоє дітей'],
['months','На скільки місяців просите відстрочку?','6'],
['plan','Як плануєте виконати рішення після відстрочки?','Погашатиму щомісяця рівними частинами після працевлаштування']],
build:a=>`До ${_(a.court)}\n\nЗаявник (боржник): ${_(a.name)}\n${_(a.addr)}\n\nСтягувач: ${_(a.creditor)}\n\nЗАЯВА\nпро відстрочення виконання рішення суду\n\nЗа результатами розгляду (${_(a.case)}) з мене присуджено до стягнення: ${_(a.amount)}.\n\nВиконати рішення у встановлений строк неможливо через обставини, що ускладнюють його виконання: ${_(a.reason)}.\n\nПісля відстрочки планую виконати рішення таким чином: ${_(a.plan)}.\n\nЗгідно зі ст. 435 Цивільного процесуального кодексу України суд може відстрочити виконання рішення з урахуванням матеріального стану сторін та інших обставин, що ускладнюють виконання.\n\nНа підставі викладеного, керуючись ст. 435 ЦПК України, ПРОШУ:\nВідстрочити виконання рішення суду строком на ${_(a.months)} міс.\n\nДодатки: докази обставин (довідки, копії документів); копія рішення; копії заяви для стягувача.\n\nДата: ${today}\nПідпис: ____________ / ${_(a.name)}`},

rozp:{name:'Розписка про отримання грошей у борг',
qs:[
['debtor','ПІБ позичальника (хто бере гроші)?','Петренко Андрій Васильович'],
['dpass','Паспортні дані та РНОКПП позичальника?','паспорт АА123456, РНОКПП 1234567890'],
['daddr','Адреса позичальника?','м. Одеса, вул. Морська, 8, кв. 3'],
['cred','ПІБ позикодавця (хто дає гроші)?','Сидоренко Олена Іванівна'],
['sum','Сума позики цифрами та словами?','20000 (двадцять тисяч) грн'],
['ret','До якої дати позичальник поверне гроші?','01.12.2026']],
build:a=>`РОЗПИСКА\n\nМ. ____________                                   ${today}\n\nЯ, ${_(a.debtor)}, ${_(a.dpass)}, зареєстрований(-а) за адресою: ${_(a.daddr)}, цією розпискою підтверджую, що отримав(-ла) від ${_(a.cred)} у борг грошові кошти в сумі ${_(a.sum)}.\n\nЗобов’язуюся повернути вказану суму в повному обсязі до ${_(a.ret)}.\n\nГроші отримав(-ла) повністю в момент підписання розписки. Розписку написано власноручно, без примусу.\n\nПідстава: ст. 1046, 1047 Цивільного кодексу України (договір позики; розписка підтверджує його укладення та передання грошей).\n\nПідпис: ____________ / ${_(a.debtor)}`},

alim:{name:'Заява про стягнення аліментів на дитину',
qs:[
['court','Назва суду за місцем проживання відповідача або вашим?','Печерський районний суд міста Києва'],
['name','ПІБ заявника (з ким проживає дитина) та адреса?','Іваненко Ірина Петрівна, м. Київ, вул. Івана Франка, 4, кв. 9'],
['resp','ПІБ відповідача (другий з батьків) та його адреса?','Іваненко Сергій Миколайович, м. Київ, вул. Мирна, 2'],
['child','ПІБ та дата народження дитини?','Іваненко Софія Сергіївна, 12.03.2018'],
['marr','Чи перебували ви в шлюбі? Коли розірвано/чи проживаєте окремо?','Шлюб розірвано 2024 р., дитина живе зі мною'],
['part','Який розмір аліментів просите? (частка доходу або сума)','1/4 усіх видів доходу, але не менше 30% прожиткового мінімуму на дитину']],
build:a=>`До ${_(a.court)}\n\nЗаявник: ${_(a.name)}\n\nВідповідач: ${_(a.resp)}\n\nЗАЯВА\nпро видачу судового наказу про стягнення аліментів на дитину\n\nДитина: ${_(a.child)}. ${_(a.marr)}. Відповідач не бере участі в утриманні дитини, матеріальної допомоги добровільно не надає.\n\nЗгідно зі ст. 180 Сімейного кодексу України батьки зобов’язані утримувати дитину до досягнення повноліття. Відповідно до ст. 182 СК розмір аліментів визначається судом, а мінімальний розмір на одну дитину не може бути меншим 30% прожиткового мінімуму для дитини відповідного віку.\n\nЗа ст. 161 ЦПК України судовий наказ може бути видано за вимогою про стягнення аліментів на дитину, якщо вона не пов’язана з встановленням чи оспорюванням батьківства.\n\nКеруючись ст. 161–163 ЦПК України, ст. 180, 182 СК України, ПРОШУ:\nВидати судовий наказ про стягнення з ${_(a.resp)} аліментів на утримання дитини у розмірі: ${_(a.part)}, починаючи з дня подання заяви і до досягнення дитиною повноліття.\n\nДодатки: копія свідоцтва про народження дитини; довідка про склад сім’ї/місце проживання дитини; копії паспорта та РНОКПП; копії заяви для відповідача.\n(Заявник звільнений від сплати судового збору за вимогами про стягнення аліментів.)\n\nДата: ${today}\nПідпис: ____________ / ${_(a.name.split(',')[0])}`},

shtraf:{name:'Скарга на постанову про штраф (адмінправопорушення)',
qs:[
['court','Назва районного суду за місцем вчинення правопорушення або вашого проживання?','Солом’янський районний суд міста Києва'],
['name','Ваші ПІБ, адреса, телефон?','Гнатюк Василь Ігорович, м. Київ, вул. Польова, 6; +380...'],
['org','Хто виніс постанову (орган) та його адреса?','Управління патрульної поліції у м. Києві'],
['pnum','Номер і дата постанови?','серія ЕНА № 1234567 від 05.09.2026'],
['art','За якою статтею КУпАП вас оштрафовано і на яку суму?','ст. 122 КУпАП, 340 грн'],
['why','Чому ви вважаєте постанову незаконною? (факти)','Знак був закритий гілками, водій не міг його побачити; докази вини відсутні']],
build:a=>`До ${_(a.court)}\n\nСкаржник: ${_(a.name)}\n\nОрган, що виніс постанову: ${_(a.org)}\n\nСКАРГА\nна постанову у справі про адміністративне правопорушення\n\n${_(a.pnum)} стосовно мене винесено постанову про притягнення до адміністративної відповідальності: ${_(a.art)}.\n\nЗ постановою не погоджуюся з таких підстав: ${_(a.why)}.\n\nВідповідно до ст. 245, 251, 280 КУпАП орган зобов’язаний всебічно, повно і об’єктивно з’ясувати обставини справи та довести вину особи. Згідно зі ст. 287–289 КУпАП постанову можна оскаржити до суду протягом 10 днів з дня її винесення.\n\nКеруючись ст. 287–289, 293 КУпАП, ПРОШУ:\n1. Скасувати постанову ${_(a.pnum)}.\n2. Провадження у справі закрити у зв’язку з відсутністю події і складу адміністративного правопорушення.\n\nДодатки: копія постанови; докази (фото, відео, свідчення); копія скарги для органу.\n\nДата: ${today}\nПідпис: ____________ / ${_(a.name.split(',')[0])}`},

shlyub:{name:'Позов про розірвання шлюбу',
qs:[
['court','Назва районного суду (за місцем проживання відповідача)?','Дарницький районний суд міста Києва'],
['name','ПІБ позивача, адреса, телефон?','Мороз Оксана Ігорівна, м. Київ, вул. Тиха, 3; +380...'],
['resp','ПІБ відповідача та адреса?','Мороз Дмитро Павлович, м. Київ, вул. Тиха, 3'],
['marr','Дата, місце реєстрації шлюбу, номер актового запису?','12.06.2015, Дарницький РАЦС, запис № 345'],
['kids','Діти (ПІБ, дата народження) або «-»?','Мороз Максим, 03.02.2017'],

build:a=>`До ${_(a.court)}\n\nПозивач: ${_(a.pl)}\nВідповідач: ${_(a.df)}\n\nПОЗОВНА ЗАЯВА\nпро поновлення на роботі та стягнення середнього заробітку за час вимушеного прогулу\n\nЯ працював(-ла) на посаді: ${_(a.post)}. Наказом ${_(a.ord)} мене звільнено. Звільнення вважаю незаконним, оскільки: ${_(a.why)}.\n\nЗгідно зі ст. 235 Кодексу законів про працю України працівника, звільненого без законної підстави, суд зобов’язує поновити на попередній роботі та стягнути середній заробіток за час вимушеного прогулу. За ст. 233 КЗпП з позовом можна звернутися протягом одного місяця з дня вручення копії наказу про звільнення.\n\nКеруючись ст. 40, 235 КЗпП України, ПРОШУ:\n1. Визнати наказ ${_(a.ord)} незаконним і скасувати його.\n2. Поновити мене на посаді.\n3. Стягнути середній заробіток за час вимушеного прогулу.\n\nДодатки: копія наказу про звільнення; копія трудової книжки/довідки; розрахунок середнього заробітку; копії позову для відповідача. (Позивач звільнений від сплати судового збору за вимогами про поновлення на роботі та стягнення заробітної плати.)\n\nДата: ${today}\nПідпис: ____________`},

klop:{name:'Клопотання про проведення слідчих дій',
qs:[['org','Кому (слідчий/прокурор, орган)?','Слідчому СВ Голосіївського УП ГУНП у м. Києві'],
['name','Хто подає (статус, ПІБ, адреса, телефон)?','Потерпілий Руденко Юрій Васильович, м. Київ, вул. Вербова, 2; +380...'],
['case','Номер кримінального провадження в ЄРДР?','№ 12026100000001234'],
['what','Яку дію просите провести?','Допитати свідка Іваненка, витребувати відео з камер спостереження'],
['why','Чому це важливо для розслідування?','Свідок бачив подію, відео зафіксувало особу, яка вчинила дії']],
build:a=>`${_(a.org)}\n\nВід: ${_(a.name)}\nУ кримінальному провадженні ${_(a.case)}\n\nКЛОПОТАННЯ\nпро проведення слідчих (розшукових) дій\n\nПрошу провести таку дію: ${_(a.what)}.\n\nОбґрунтування: ${_(a.why)}.\n\nЗгідно зі ст. 220 Кримінального процесуального кодексу України слідчий, прокурор зобов’язаний розглянути клопотання не пізніше трьох днів з дня його подання. Про результати розгляду мене має бути повідомлено (постанова про відмову підлягає оскарженню).\n\nКеруючись ст. 56, 220 КПК України, ПРОШУ задовольнити клопотання.\n\nДата: ${today}\nПідпис: ____________`},

zvern:{name:'Звернення громадянина до органу влади',
qs:[['org','До кого (орган, посадова особа)?','Київська міська державна адміністрація'],
['name','Ваші ПІБ, адреса, телефон/e-mail?','Бойко Андрій, м. Київ, вул. Зоряна, 1; a@mail.com'],
['kind','Вид звернення?',['Скарга','Пропозиція','Заява (клопотання)']],
['text','Суть звернення (що, де, коли, чого просите)?','Прошу відремонтувати дорогу біля буд. 1 на вул. Зоряній, що зруйнована з 2025 р.']],
build:a=>`${_(a.org)}\n\nВід: ${_(a.name)}\n\n${a.kind.toUpperCase()}\n\n${_(a.text)}\n\nЗгідно зі ст. 5, 7, 20 Закону України «Про звернення громадян» звернення розглядається протягом одного місяця від дня надходження, а якщо вирішити питання швидше неможливо - не більше 45 днів. Прошу надати письмову відповідь за вказаною адресою.\n\nДодатки (за потреби): копії документів, фото.\n\nДата: ${today}\nПідпис: ____________ / ${_(a.name.split(',')[0])}`},

admpoz:{name:'Адміністративний позов до органу влади',
qs:[['court','Назва суду (окружний адміністративний суд)?','Київський окружний адміністративний суд'],
['pl','Позивач: ПІБ, адреса, телефон?','Бойко Андрій, м. Київ, вул. Зоряна, 1; +380...'],
['df','Відповідач (орган влади, адреса)?','Департамент соціальної політики, м. Київ, вул. Хрещатик, 36'],
['dec','Яке рішення, дію чи бездіяльність оскаржуєте (дата, номер)?','Відмова у призначенні допомоги, лист № 123 від 01.09.2026'],
['why','Чому це незаконно?','Я відповідаю умовам закону, документи подано вчасно, відмова не мотивована'],
['req','Що просите?','Скасувати відмову і зобов’язати призначити допомогу']],
build:a=>`До ${_(a.court)}\n\nПозивач: ${_(a.pl)}\nВідповідач: ${_(a.df)}\n\nАДМІНІСТРАТИВНИЙ ПОЗОВ\nпро оскарження рішення суб’єкта владних повноважень\n\nОскаржуване рішення (дія/бездіяльність): ${_(a.dec)}.\n\nОбставини: ${_(a.why)}.\n\nЗгідно зі ст. 2 Кодексу адміністративного судочинства України у публічно-правових спорах суд перевіряє, чи прийнято рішення в межах повноважень, обґрунтовано, добросовісно, розсудливо та пропорційно. За ст. 122 КАС з позовом можна звернутися протягом шести місяців з дня, коли особа дізналася про порушення.\n\nКеруючись ст. 160, 161 КАС України, ПРОШУ: ${_(a.req)}.\n\nДодатки: копія оскаржуваного рішення; докази; квитанція про судовий збір (згідно із Законом «Про судовий збір»); копії позову для відповідача.\n\nДата: ${today}\nПідпис: ____________`}
});
CAT['Цивільне право'].push('pretpos','pozychka','akt','vidz');
CAT['Сімейне право'].push('pobach');
CAT['Трудове право'].push('vidp','onov');
CAT['Кримінальне право'].push('klop');
CAT['Адміністративне право'].push('zvern','admpoz');

let st=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function add(text,cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function bot(text,cls='b'){const t=document.createElement('div');t.className='m b';t.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';log.appendChild(t);log.scrollTop=log.scrollHeight;await sleep(450);t.className='m '+cls;t.textContent=text;log.scrollTop=log.scrollHeight}
function chips(list,fn){const c=document.createElement('div');c.className='chips';list.forEach(x=>{const b=document.createElement('button');b.className='chip';b.textContent=x;b.onclick=()=>{c.remove();add(x,'u');fn(x)};c.appendChild(b)});log.appendChild(c);log.scrollTop=log.scrollHeight;lock(true)}
function lock(v){inp.disabled=v;send.disabled=v;if(!v)inp.focus()}

async function start(){
 st=null;lock(true);
 await bot('Вітаю! Я допоможу скласти проєкт юридичного документа. Просто відповідайте на запитання, а я підставлю дані у шаблон.');
 menu();
}
async function menu(){
 await bot('Оберіть галузь права:');
 chips(Object.keys(CAT),async c=>{await bot('Який документ потрібен?');chips([...CAT[c].map(k=>T[k].name),'← Назад до галузей'],n=>n.startsWith('←')?menu():pick(n))});
}
async function pick(n){
 const k=Object.keys(T).find(k=>T[k].name===n);
 st={k,i:0,a:{}};
 await bot('Добре: «'+n+'». Відповідайте по одному пункту. Якщо не знаєте — напишіть «-», і поле залишиться порожнім.');
 ask();
}
async function ask(){
 const q=T[st.k].qs[st.i];
 await bot(`(${st.i+1}/${T[st.k].qs.length}) ${q[1]}`);
 if(Array.isArray(q[2])){chips(q[2],v=>answer(v))}
 else{inp.placeholder='Напр.: '+q[2];lock(false)}
}
async function answer(v){
 const q=T[st.k].qs[st.i];
 st.a[q[0]]=v==='-'?'':v;st.i++;
 if(st.i<T[st.k].qs.length)ask();else finish();
}
async function finish(){
 lock(true);inp.placeholder='Ваша відповідь…';
 await bot('Дякую! Ось проєкт документа. Перевірте дані перед використанням.');
 const text=T[st.k].build(st.a);
 const d=add(text,'doc');
 const a=document.createElement('div');a.className='act';
 [['Копіювати',()=>navigator.clipboard&&navigator.clipboard.writeText(text).then(()=>alert('Скопійовано'),()=>alert('Не вдалося скопіювати. Виділіть текст вручну.'))],
  ['Друкувати / у PDF',()=>{const w=window.open('','_blank');if(!w){alert('Дозвольте спливаючі вікна для друку.');return}w.document.write('<pre style="font:14px/1.6 Times New Roman,serif;white-space:pre-wrap;margin:2cm">'+text.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre>');w.document.close();w.print()}],
  ['Скласти інший документ',start]].forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;a.appendChild(b)});
 log.appendChild(a);
 add('Застереження: це автоматично згенерований проєкт, а не юридична консультація. Перед подачею перевірте норми права, актуальні строки та суму судового збору, за потреби — зверніться до юриста або в центр безоплатної правничої допомоги.','w');
 log.scrollTop=log.scrollHeight;
}
function submit(){const v=inp.value.trim();if(!v||inp.disabled)return;inp.value='';add(v,'u');lock(true);answer(v)}
send.onclick=submit;inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
start();
</script>
</body>
</html>
